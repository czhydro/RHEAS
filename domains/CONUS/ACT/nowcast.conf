[nowcast]
model: vic
startdate: 2015-1-1
enddate: 2015-12-31
basin: /path/to/your/domain/ACT_Dissolved.shp
name:ACT_5k
resolution: 0.05

[vic]
precip: prism
temperature: prism
wind: ncep
initialize: no
#initial state: /path/to/statefile/state/vic.state_20121231
#save state: /path/to/statefile/state/
save to: db
save: runoff,rainf, evap, baseflow, soil_moist
rout = True
rout path = /path/to/domain/routing/information/
analysis = True 

[dssat]
shapefile: /path/to/dssat/polygon/within/vic/basin/
ensemble size: 10
crop: maize
assimilation: off
analysis: True
